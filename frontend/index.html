<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>manaDJ</title>
  </head>
  <body>
    <!-- Pre-mount loader: dark backdrop + wordmark + generic throbber shown
         until React's first render replaces #root's children. Keeps the
         Electron splash → app handoff seamless (desktop/main.js paints the
         same #111 and throbber). -->
    <style>
      html, body { background: #111; margin: 0; }
      .boot-splash {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
      }
      .boot-splash span {
        color: #eee; font: 700 20px/1 -apple-system, sans-serif; letter-spacing: 0.04em;
      }
      .boot-splash .boot-throbber {
        width: 28px; height: 28px; border: 3px solid #333; border-top-color: #4fc3f7;
        border-radius: 50%; animation: boot-spin 0.8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
    <div id="root">
      <div class="boot-splash">
        <span>manaDJ</span>
        <div class="boot-throbber"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

name: Publish integrated private sync source candidate
on:
  push:
    branches: [instinct/native-sync-apple-disabled]
    paths: [.github/workflows/continuous-source-publish.yml]
permissions:
  contents: write
concurrency:
  group: continuous-integrated-source-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a3831391d9cf15da66a30587790da152c06b0d5a
          fetch-depth: 0
      - name: Apply exact integrated source, no credentials or private assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYPATCH'
          import zlib,base64,hashlib,pathlib
          raw=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest()=='bdfc9b0b871a5e250f209981482746171c3a121fe9f05f8da64e9d44df27ac26'
          pathlib.Path('/tmp/integrated.patch').write_bytes(raw)
          PYPATCH
          git switch -c instinct/continuous-sync-integrated
          git apply --check /tmp/integrated.patch
          git apply /tmp/integrated.patch
          git config user.name 'Instinct'
          git config user.email 'agent@instinct.com'
          git add android backend cloud desktop frontend ios scripts tests
          git commit -m 'Integrate bounded cross-device metadata and session history candidate'
          git push origin HEAD:refs/heads/instinct/continuous-sync-integrated

name: Publish integrated private sync source candidate
on:
  push:
    branches: [instinct/native-sync-apple-disabled]
    paths: [.github/workflows/continuous-source-publish.yml]
permissions:
  contents: write
concurrency:
  group: continuous-integrated-source-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: a3831391d9cf15da66a30587790da152c06b0d5a
          fetch-depth: 0
      - name: Publish native owner acceptance and running capture test
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin instinct/continuous-sync-integrated
          git switch -c instinct/continuous-sync-integrated FETCH_HEAD
          python3 - <<'PYPATCH'
          import zlib,base64,hashlib,pathlib
          raw=zlib.decompress(base64.b64decode(''))
          assert hashlib.sha256(raw).hexdigest()=='a172f022c851e539c8b4426918bebe6478e901e0db5c803208074353bf8266fc'
          pathlib.Path('/tmp/migration.patch').write_bytes(raw)
          PYPATCH
          git apply --check /tmp/migration.patch
          git apply /tmp/migration.patch
          git config user.name 'Instinct'
          git config user.email 'agent@instinct.com'
          python3 - <<'PYTEST'
          import pathlib
          p=pathlib.Path('ios/ManadjUITests/WorkspaceUITests.swift')
          p.write_text(p.read_text().replace('XCTAssertFalse(app.buttons["SIGN IN"].isEnabled)','XCTAssertTrue(app.buttons["SIGN IN"].isEnabled)').replace('Disabled private sync controls, no provisioning or cloud effects','Owner sign-in available, personal data transport disabled'))
          PYTEST
          git add ios
          git commit -m 'Prepare explicit native owner acceptance without personal data activation'
          git push origin HEAD:refs/heads/instinct/continuous-sync-integrated

name: Deploy explainer site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'frontend/src/theme/**'
      - 'frontend/public/logo.png'
      - '.github/workflows/explainer-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explainer-site-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - uses: actions/configure-pages@v5
      - name: Build site
        run: uv run site/build.py --output .site-dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site-dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

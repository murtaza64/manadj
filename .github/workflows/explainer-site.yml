name: Deploy explainer site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/release/**'
      - 'frontend/src/theme/**'
      - 'frontend/public/logo.png'
      - '.github/workflows/explainer-site.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: explainer-site-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - uses: actions/configure-pages@v5
      - name: Refuse stale queued source before building
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$GITHUB_SHA" = "$(gh api repos/murtaza64/manadj/commits/main --jq .sha)"
      - name: Build site
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run -m scripts.release.android_pages_build --output .site-dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .site-dist/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Refuse stale source or snapshot pointer before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$GITHUB_SHA" = "$(gh api repos/murtaza64/manadj/commits/main --jq .sha)"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

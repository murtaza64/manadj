# Candidate macOS DMG build for a release-candidate lane: fires on push so
# the branch produces a testable artifact BEFORE anything lands on main
# (workflow_dispatch only works once a workflow exists on the default
# branch). Artifact only - never touches releases, tags or main; delete
# from any merge proposal, where release-macos.yml (dispatch-only) is the
# lasting twin of release-windows.yml. Ad-hoc signed, matching
# docs/install.md (right-click -> Open; manaDJ is not notarized).
#
# Scoped to the exact candidate branch, not instinct/**: one build per
# landed edit batch, never one per partial web edit on unrelated lanes.
# The concurrency group cancels a superseded run on the same branch, so
# rapid pushes collapse to the newest tree. A future candidate lane adds
# its branch here for the duration of its candidacy.

name: candidate-macos
on:
  push:
    branches: ["instinct/wallpaper-theme"]

permissions:
  contents: read

concurrency:
  group: candidate-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: version
        id: v
        run: |
          v=$(sed -nE 's/^version *= *"([^"]+)".*/\1/p' pyproject.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: build DMG
        run: uv run scripts/release/build_dmg.py --version "${{ steps.v.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: manaDJ-candidate-${{ github.sha }}-macos-arm64
          path: build/release/out/*.dmg
          compression-level: 0
          retention-days: 7

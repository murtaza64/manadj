name: Bounded private sync trial lifecycle
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [baseline, enable, disable]
        default: baseline
        required: true
      bootstrap:
        description: Public generated or owner group bootstrap JSON, enable only
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: private-library-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'murtaza64/manadj' && github.ref == 'refs/heads/instinct/native-sync-apple-disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize exact reviewed immutable Worker and baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDEPLOY'
          import base64,hashlib,tarfile,io
          raw=base64.b64decode('')
          assert hashlib.sha256(raw).hexdigest()=='b9670166b5dfd28d6203322f3d65da1b8e956f299f005654583167965439fe44'
          tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz').extractall('.')
          PYDEPLOY
      - name: Prepare exact lifecycle mode, no secret overwrite
        env:
          TRIAL_MODE: ${{ inputs.mode }}
          TRIAL_BOOTSTRAP: ${{ inputs.bootstrap }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYCONFIG'
          import json,os,uuid
          p='cloud/library/sync-review/wrangler.trial-disabled.json'
          c=json.load(open(p));m=os.environ['TRIAL_MODE'];assert m in ('baseline','enable','disable')
          if m=='enable':
            b=json.loads(os.environ['TRIAL_BOOTSTRAP']);assert str(uuid.UUID(b['group']))==b['group']
            assert 2<=len(b['members'])<=3
            for x in b['members']:
              import base64
              assert str(uuid.UUID(x['origin']))==x['origin'] and x['subject'] and len(base64.b64decode(x['key'],validate=True))==32
            c['vars']['SYNC_ENABLED']='true';c['vars']['SYNC_GROUP']=b['group'];c['vars']['SYNC_BOOTSTRAP']=json.dumps(b,separators=(',',':'))
          json.dump(c,open(p,'w'),indent=2)
          PYCONFIG
      - name: Locked dependencies and credential-free packaging
        working-directory: cloud/library
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install wrangler deploy --config sync-review/wrangler.trial-disabled.json --dry-run --outdir "$RUNNER_TEMP/worker-bundle"
      - name: Deploy approved lifecycle state, retaining class and private data
        working-directory: cloud/library
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LIBRARY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4f837dfdb11165a1c1cbbf676db0684
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --no-install wrangler deploy --config sync-review/wrangler.trial-disabled.json

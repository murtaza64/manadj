name: Reviewed private snapshot lifecycle
on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [enable, disable]
        default: disable
        required: true
permissions:
  contents: read
concurrency:
  group: private-library-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'murtaza64/manadj' && github.ref == 'refs/heads/instinct/native-sync-apple-disabled'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Materialize exact reviewed immutable Worker and baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYDEPLOY'
          import base64,hashlib,tarfile,io
          raw=base64.b64decode('')
          assert hashlib.sha256(raw).hexdigest()=='7e5793ad25044815d6c2ff265da47ced932a79973621066a6037ae94747ecfc3'
          tarfile.open(fileobj=io.BytesIO(raw),mode='r:gz').extractall('.')
          PYDEPLOY
      - name: Select fixed snapshot-only configuration
        env:
          SNAPSHOT_MODE: ${{ inputs.mode }}
        shell: bash
        run: |
          python3 - <<'PYCONFIG'
          import json,os,shutil
          m=os.environ['SNAPSHOT_MODE'];assert m in ('enable','disable')
          p='cloud/library/snapshot-review/wrangler.snapshot-'+('enabled' if m=='enable' else 'disabled')+'.json'
          c=json.load(open(p));assert c['vars']['SYNC_ENABLED']=='false'
          assert c['vars']['SNAPSHOTS_ENABLED']==('true' if m=='enable' else 'false')
          assert c['r2_buckets']==[{'binding':'LIBRARY_BUCKET','bucket_name':'manadj-library-data'}]
          assert c['durable_objects']=={'bindings':[{'name':'SYNC_GROUPS','class_name':'SyncGroup'}]}
          shutil.copyfile(p,'cloud/library/snapshot-review/wrangler.selected.json')
          PYCONFIG
      - name: Locked dependencies and credential-free packaging
        working-directory: cloud/library
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npx --no-install wrangler deploy --config snapshot-review/wrangler.selected.json --dry-run --outdir "$RUNNER_TEMP/worker-bundle"
      - name: Deploy approved lifecycle state, retaining class and private data
        working-directory: cloud/library
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LIBRARY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4f837dfdb11165a1c1cbbf676db0684
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          npx --no-install wrangler deploy --config snapshot-review/wrangler.selected.json

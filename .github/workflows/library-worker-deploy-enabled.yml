name: Deploy enabled private library Worker (reviewed staging pin)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: private-library-worker-deploy
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && github.repository == 'murtaza64/manadj'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: cloud/library
        shell: bash
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Check out reviewed immutable library source, never a caller-selected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fc6b88402e6680c4df87ec847cbf5eb36f86a47f
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Verify exact existing target, enabled switch, intended private bucket only
        run: |
          set -euo pipefail
          python check_config_enabled.py
          python -m unittest discover -p test_config_enabled.py
      - name: Locked install, synthetic tests, freshness guard and credential-free packaging
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          node sync_check_page.mjs --check
          npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/library-worker-bundle"
      - name: Deploy only the existing library Worker, snapshots enabled with private bucket
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_LIBRARY_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: a4f837dfdb11165a1c1cbbf676db0684
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing scoped library deployment credential'; exit 1; }
          npm run deploy

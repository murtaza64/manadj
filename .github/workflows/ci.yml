# Regression gate: backend + frontend + desktop shell on Windows, Linux and
# macOS (cross-platform #319; promoted from the #299 probe workflow).
#
# Known per-OS failures are deselected in the pytest step with the issue
# that fixes each; the lane landing a fix deletes its
# line, so the gate only ever goes red on NEW breakage.
name: Windows fixture trace diagnostic
on:
  push:
    branches: [main, "probe/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux) sudo apt-get update -q && sudo apt-get install -yq ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
            macOS) brew install ffmpeg ;;
          esac
          ffmpeg -version | head -1

      - name: uv sync
        run: uv sync --frozen

      - name: Synthetic Windows identity diagnostic
        if: runner.os == 'Windows'
        continue-on-error: true
        run: uv run --no-sync pytest -q -s tests/test_windows_stat_probe.py

      - name: pytest
        run: |
          set -o pipefail
          uv run --no-sync pytest -q -p no:cacheprovider --ignore=tests/test_windows_stat_probe.py 2>&1 | tee windows-fixture-trace.log

      - name: Preserve actual fixture refusal traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-fixture-trace
          path: windows-fixture-trace.log
          if-no-files-found: warn
          retention-days: 3

name: Disabled native sync Apple qualification
on:
  push:
    branches: [instinct/native-sync-apple-disabled]
  pull_request:
    branches: [main]
    paths: [native-sync-apple-candidate.patch, .github/workflows/native-sync-apple-qualification.yml]
permissions:
  contents: read
concurrency:
  group: native-sync-apple-${{ github.ref }}
  cancel-in-progress: false
jobs:
  disabled-candidate:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact disabled source and apply in disposable CI checkout
        shell: bash
        run: |
          set -euo pipefail
          echo '6c550f229ad8269edde553d0b05e30726b111dc532408f9fb84b7b3173fae932  native-sync-apple-candidate.patch' | shasum -a 256 -c -
          git apply --check native-sync-apple-candidate.patch
          git apply native-sync-apple-candidate.patch
          echo 'ac7135c7cd791f0d2560397a5b0c0801bb321e5e91a0e0565815ecd2902317a0  native-library-edit-candidate.patch' | shasum -a 256 -c -
          git apply --check --exclude=backend/continuous_sync/NATIVE_CAPTURE.md native-library-edit-candidate.patch
          git apply --exclude=backend/continuous_sync/NATIVE_CAPTURE.md native-library-edit-candidate.patch
          echo 'bccfe3f8fd584f05f9220d49cd8e0bd46cc728e01ae2333d6c3ecef94d0a724d  native-review-fixes-auth.patch' | shasum -a 256 -c -
          git apply --check --exclude=backend/continuous_sync/NATIVE_CAPTURE.md native-review-fixes-auth.patch
          git apply --exclude=backend/continuous_sync/NATIVE_CAPTURE.md native-review-fixes-auth.patch
          echo '17a73a10a68f7790375bf25b14644af342854e580b719551ad5ce6e313dca216  native-isolation-codec.patch' | shasum -a 256 -c -
          git apply --check --exclude=backend/continuous_sync/NATIVE_CAPTURE.md native-isolation-codec.patch
          git apply --exclude=backend/continuous_sync/NATIVE_CAPTURE.md native-isolation-codec.patch
          echo '783fe8a4778c395fe86d8b1d1cf257b5f34984386b5aba5133b506a917eff01c  native-schema-interop.patch' | shasum -a 256 -c -
          git apply --check --exclude=backend/continuous_sync/NATIVE_CAPTURE.md native-schema-interop.patch
          git apply --exclude=backend/continuous_sync/NATIVE_CAPTURE.md native-schema-interop.patch
          echo '9dbbc81c6f640e4208c8000edbd46f4d6a8b3223eab565b4ff50b5742758abbb  native-metadata-wire.patch' | shasum -a 256 -c -
          git apply --check native-metadata-wire.patch
          git apply native-metadata-wire.patch
          echo 'e5d1ebb5a02a4aacf4b78a0840733aa6a4404902cba5e47448b3785af67ce63e  native-app-wire.patch' | shasum -a 256 -c -
          git apply --check native-app-wire.patch
          git apply native-app-wire.patch
          python3 -c 'import base64,zlib,pathlib;pathlib.Path("/tmp/generated-backend.patch").write_bytes(zlib.decompress(base64.b64decode("")))'
          echo '719bb6dd6943fb71c3daa62405713f7ca27b1d6c761f672fe3af712708a91531  /tmp/generated-backend.patch' | shasum -a 256 -c -
          git apply --check /tmp/generated-backend.patch
          git apply /tmp/generated-backend.patch
          git diff --stat
      - name: Select latest production Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE=$(find /Applications -maxdepth 1 -name 'Xcode_*.app' ! -iname '*beta*' | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version
          xcrun swift --version
      - name: Apple package tests with generated data only
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/qualification/native-transport-fixture.py > native-loopback-fixture.log 2>&1 &
          FIXTURE_PID=$!
          trap 'kill "$FIXTURE_PID" || true' EXIT
          export MANADJ_NATIVE_HTTP_FIXTURE=1
          export MANADJ_NATIVE_VECTOR_OUTPUT="$GITHUB_WORKSPACE/native-generated"
          (cd ios/Packages/ManadjCore && swift test -j 2) 2>&1 | tee native-core-apple.log
          (cd ios/Packages/ManadjAudio && swift test -j 2) 2>&1 | tee native-audio-apple.log
      - name: Independent Python verifies generated native signature and tamper denial
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/native-verify"
          "$RUNNER_TEMP/native-verify/bin/pip" install rfc8785==0.1.4 cryptography==46.0.3
          "$RUNNER_TEMP/native-verify/bin/python" scripts/qualification/verify-native-signed-vector.py native-generated/native-signed-vector.json | tee native-python-interop.log
      - name: Generated Apple history through HTTP relay into independent backend SQLite
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/native-verify/bin/pip" install sqlalchemy alembic fastapi httpx pydantic mutagen
          PYTHONPATH=. "$RUNNER_TEMP/native-verify/bin/python" scripts/qualification/verify-native-history-application.py native-generated/native-history-packets.json | tee native-history-application.log
      - name: Compile actual iOS host and AppModel without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -project ios/Manadj.xcodeproj -scheme Manadj -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/native-device" CODE_SIGNING_ALLOWED=NO ARCHS=arm64 SWIFT_STRICT_CONCURRENCY=complete build 2>&1 | tee native-device.log
      - name: Test disabled host lifecycle on simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; groups=json.load(sys.stdin)["devices"]; phones=[d for r,ds in sorted(groups.items(),reverse=True) if "iOS" in r for d in ds if d.get("isAvailable") and d["name"].startswith("iPhone")]; assert phones; print(phones[0]["udid"])')
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild -project ios/Manadj.xcodeproj -scheme Manadj -sdk iphonesimulator -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath "$RUNNER_TEMP/native-sim" -parallel-testing-enabled NO -only-testing:ManadjTests/NativeAudioTests/testSessionCaptureCandidateRemainsDisabledAndLifecycleCloses -only-testing:ManadjUITests/WorkspaceUITests/testPrivateCloudControlsDisabledAndVisible -resultBundlePath NativeSync.xcresult CODE_SIGNING_ALLOWED=NO ONLY_ACTIVE_ARCH=YES ARCHS="$(uname -m)" test 2>&1 | tee native-simulator.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: disabled-native-sync-apple-evidence
          path: |
            native-*.log
            NativeSync.xcresult
            native-generated/*.json
          retention-days: 3

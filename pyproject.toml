[project]
name = "manadj"
version = "0.1.0"
description = "Engine DJ database access library"
requires-python = ">=3.13"
# Unimported heavyweights (tensorflow, librosa, beatnet, matplotlib) were
# removed from the base install for the packaged app (ADR 0043, #280) —
# nothing imports them (tests/test_heavy_dep_guard.py polices the suite).
dependencies = [
    "alembic>=1.18.5",
    "beat-this",
    "fastapi>=0.122.0",
    "kaitaistruct>=0.11",
    "madmom",
    "mutagen>=1.47.0",
    "numpy>=2.3.5",
    "pillow>=12.0.0",
    "psutil>=7.1.3",
    "pyrekordbox>=0.4.4",
    "requests>=2.32.5",
    "scipy>=1.16.3",
    "soundfile>=0.13.1",
    "sqlalchemy>=2.0.0,<3.0.0",
    "tomlkit>=0.15.1",
    "torch==2.9.1",
    "torchaudio==2.9.1",
    "types-requests>=2.33.0.20260518",
    "uvicorn>=0.38.0",
    "yt-dlp>=2026.6.9",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28.1",
    "mypy>=1.7.0",
    "pytest>=9.0.1",
    "ruff>=0.1.0",
    "types-yt-dlp>=2026.3.17.20260605",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.uv]
# stems is a default group so plain `uv run` never prunes demucs from the venv
# (the split pipeline invokes it as a subprocess; the backend never imports it —
# see backend/stems.py import-hygiene note, stems map #118 / #149).
#
# harness: offline analysis candidates only (harness/*_candidates.py); the app
# never imports essentia. It has no Windows wheel or sdist, nor a linux-aarch64
# wheel (#302), so it installs only where wheels exist.
default-groups = ["dev", "stems", "harness"]

[tool.uv.sources]
madmom = { git = "https://github.com/CPJKU/madmom" }
beat-this = { git = "https://github.com/CPJKU/beat_this" }
# Linux x86_64 PyPI torch is the CUDA build (~3.9 GB with nvidia/triton);
# take the CPU build there. macOS/Windows PyPI wheels are already CPU (#302).
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.1",
    "watchfiles>=1.2.0",
]
stems = [
    "demucs>=4.0.1",
]
harness = [
    "essentia>=2.1b6.dev1389; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine == 'x86_64')",
]

<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #viz { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #hud { position: fixed; left: 50%; top: 40%; transform: translateX(-50%); display: none; white-space: pre; font: 11px monospace; color: #0f0; background: rgba(0,0,0,.6); padding: 4px 6px; }
</style>
</head>
<body>
<canvas id="viz"></canvas>
<div id="hud"></div>
<script src="viz.js"></script>
</body>
</html>
